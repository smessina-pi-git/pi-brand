<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI Brand</title>
<meta name="description" content="Launch and download branded tools, videos and skills from PI Brand Marketing.">
<link rel="icon" href="assets/PI_Logo_Circle.svg">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<canvas id="glow" aria-hidden="true"></canvas>
<div class="page">
  <header class="masthead">
    <img class="logo" src="assets/PI_Logo_White.png" alt="The Predictive Index">
    <p class="status mono"><span class="dot"></span><span id="status">Loading</span></p>
    <div class="hairline" aria-hidden="true"><i></i></div>
  </header>

  <section class="hero">
    <h1 class="display">PI Brand</h1>
    <p class="lede">New brand tools, videos and skills, ready to launch and download.</p>
    <div id="featured" class="featured"></div>
  </section>

  <nav class="filters" id="filters" aria-label="Filter projects"></nav>
  <main id="sections"></main>

  <footer class="colophon">
    <span>Built by Brand Marketing</span>
    <a href="https://github.com/smessina-pi-git/pi-brand">Source on GitHub</a>
  </footer>
</div>
<script src="js/app.js"></script>
</body>
</html>
